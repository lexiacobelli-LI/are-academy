Q({ id: "q-pjm-01", div: "pjm", obj: "pjm-2.2", lesson: "pjm-schedule", type: "calc", diff: 2, fmt: "Calculation",
  q: "Activities: A (3 days) starts the project. B (5 days) and C (2 days) both follow A. D (4 days) follows both B and C. E (2 days) follows D and ends the project. What is the minimum project duration in days?",
  ans: 14, tol: 0, unit: "days",
  explain: "Paths: A–B–D–E = 3 + 5 + 4 + 2 = 14 days; A–C–D–E = 3 + 2 + 4 + 2 = 11 days. The longest path (14 days) is critical and sets the duration.",
  ref: "PMI, PMBOK Guide — critical path method" });

Q({ id: "q-pjm-02", div: "pjm", obj: "pjm-2.2", lesson: "pjm-schedule", type: "calc", diff: 2, fmt: "Calculation",
  q: "Using the same network (A 3, B 5, C 2, D 4, E 2; B and C follow A; D follows B and C; E follows D), how many days of total float does activity C have?",
  ans: 3, tol: 0, unit: "days",
  explain: "C: ES = 3, EF = 5. D cannot start until day 8 (after B), so C's LF = 8 and LS = 6. Total float = LS − ES = 6 − 3 = 3 days. Shortcut: 14 (critical) − 11 (longest path through C) = 3.",
  ref: "PMI, PMBOK Guide" });

Q({ id: "q-pjm-03", div: "pjm", obj: "pjm-4.1", lesson: "pjm-schedule", type: "calc", diff: 3, fmt: "Calculation",
  q: "The CD phase has a labor budget of $80,000. The team reports the phase is 50% complete and has spent $50,000. If performance continues at the same efficiency, what is the estimate at completion for the phase?",
  ans: 100000, tol: 1, unit: "$",
  explain: "EV = 0.50 × 80,000 = 40,000. CPI = EV ÷ AC = 40,000 ÷ 50,000 = 0.80. EAC = BAC ÷ CPI = 80,000 ÷ 0.80 = $100,000, a $20,000 projected overrun.",
  ref: "PMI, PMBOK Guide — earned value management" });

Q({ id: "q-pjm-04", div: "pjm", obj: "pjm-3.3", lesson: "pjm-contracts", type: "mc", diff: 1, fmt: "Multiple choice",
  q: "Who are the parties to the owner–contractor agreement (A101) to which A201 is attached as the general conditions?",
  opts: ["Owner, contractor and architect", "Owner and contractor", "Architect and contractor", "Owner and architect"],
  ans: 1,
  why: ["The architect is named in A201 and given duties, but is not a party to the construction contract.",
    "Correct. Only the owner and contractor sign A101.",
    "There is no contract between architect and contractor.",
    "That is B101."],
  explain: "The architect's construction-phase authority comes from A201's description of the role and the architect's obligation under B101 to perform it.",
  ref: "AIA A201–2017, §1.1.2 and Article 4" });

Q({ id: "q-pjm-05", div: "pjm", obj: "pjm-4.2", lesson: "pjm-contracts", type: "mc", diff: 2, fmt: "Scenario",
  q: "During construction documents, the owner asks the architect to prepare a full second set of interior elevations with an alternative finish palette for comparison. What should the architect do FIRST?",
  opts: ["Prepare the elevations and bill them as an additional service on the next invoice", "Decline because the request is outside basic services", "Notify the owner in writing that this is an additional service, with its fee and schedule effect, and obtain written authorization", "Ask the interior design consultant to absorb the work in their fee"],
  ans: 2,
  why: ["Billing after the fact risks a fee dispute; authorization should come first.",
    "Additional services are legitimate; declining is unnecessary.",
    "Correct. B101–2017 requires notice and owner authorization before the architect provides additional services.",
    "Shifting the burden to a consultant without a contract change is improper."],
  explain: "Written notice and authorization before starting protects the fee and the schedule.",
  ref: "AIA B101–2017, Article 4 (Supplemental and Additional Services)" });

Q({ id: "q-pjm-06", div: "pjm", obj: "pjm-3.2", lesson: "pjm-contracts", type: "mc", diff: 2, fmt: "Multiple choice",
  q: "How should an architect–consultant agreement (C401) relate to the owner–architect agreement (B101)?",
  opts: ["It should be independent so the consultant's terms do not affect the owner", "The consultant's obligations to the architect should be consistent with the architect's obligations to the owner for that consultant's services", "It should give the consultant direct rights against the owner", "It should be signed by the owner as well"],
  ans: 1,
  why: ["Independent terms create gaps the architect must cover.",
    "Correct. Flow-down keeps the consultant bound to the same standard, schedule and requirements the architect owes the owner.",
    "Consultants generally have no contract with the owner in this arrangement.",
    "The owner is not a party to C401."],
  explain: "C401 is drafted to coordinate with B101; check insurance, schedule, ownership of documents and dispute terms.",
  ref: "AIA C401–2017" });

Q({ id: "q-pjm-07", div: "pjm", obj: "pjm-2.1", lesson: "pjm-schedule", type: "calc", diff: 2, fmt: "Calculation",
  q: "The total fee is $500,000, of which $150,000 is for consultants. Using a traditional phase split (SD 15%, DD 20%, CD 40%, bidding 5%, CA 20%) applied to the architect's own portion, how much fee is allocated to the CD phase?",
  ans: 140000, tol: 1, unit: "$",
  explain: "Architect's portion = 500,000 − 150,000 = 350,000. CD = 0.40 × 350,000 = $140,000.",
  ref: "Architect's Handbook of Professional Practice — project management" });

Q({ id: "q-pjm-08", div: "pjm", obj: "pjm-3.1", lesson: "pjm-contracts", type: "mc", diff: 2, fmt: "Multiple choice",
  q: "Under B101–2017, in which phase does the architect prepare documents that fix and describe the size and character of the project, including structural, mechanical and electrical systems and materials?",
  opts: ["Schematic Design", "Design Development", "Construction Documents", "Procurement"],
  ans: 1,
  why: ["SD establishes the general concept and options.",
    "Correct. DD fixes and describes the size and character of the project.",
    "CDs set forth requirements for construction in detail.",
    "Procurement covers bidding or negotiation."],
  explain: "Know the verbs of each phase: SD explores, DD fixes, CD details.",
  ref: "AIA B101–2017, Article 3" });

Q({ id: "q-pjm-09", div: "pjm", obj: "pjm-5.2", lesson: "pjm-contracts", type: "ms", diff: 2, fmt: "Check all that apply", pick: 3,
  q: "Which three are part of an architect's internal quality-control process for construction documents? Select three.",
  opts: ["Interdisciplinary coordination checks at set milestones", "Directing the contractor's construction sequence", "A code compliance review against a checklist", "Peer review of the set by a senior architect not on the team", "Verifying the contractor's crew sizes on site"],
  ans: [0, 2, 3],
  why: ["Correct.", "Means, methods and sequences belong to the contractor.", "Correct.", "Correct.", "Crew sizing is a contractor matter."],
  explain: "QC belongs to the architect's own work product: checking, coordinating and reviewing documents before issue.",
  ref: "Architect's Handbook of Professional Practice — quality management" });

Q({ id: "q-pjm-10", div: "pjm", obj: "pjm-3.4", lesson: "pjm-contracts", type: "mc", diff: 3, fmt: "Scenario",
  q: "The owner retained its own geotechnical engineer. The report arrives three weeks late, and the foundation design cannot proceed. Later, a soil condition the report did not identify causes a redesign. Which statement is most accurate under B101–2017?",
  opts: ["The architect is responsible for the late report because the architect coordinates all consultants", "The owner furnishes the geotechnical services, and the architect is entitled to rely on their accuracy; the architect should notify the owner of the schedule impact", "The architect must verify the geotechnical findings with independent borings", "The geotechnical engineer is the architect's consultant once the report is delivered"],
  ans: 1,
  why: ["The architect coordinates its own consultants; the owner is responsible for services it furnishes.",
    "Correct. B101 makes the owner responsible for furnishing such services and entitles the architect to rely on them. Redesign from a missed condition may be an additional service.",
    "Independent verification is not required and would duplicate the owner's consultant.",
    "Delivery of the report does not change the contracting relationship."],
  explain: "Owner-furnished information (surveys, geotechnical reports) is the owner's responsibility; the architect relies on it and notifies the owner of impacts.",
  ref: "AIA B101–2017, §3.1.2 (reliance on owner-furnished services) and Article 5 (Owner's Responsibilities)" });

Q({ id: "q-pjm-11", div: "pjm", obj: "pjm-3.1", lesson: "pjm-contracts", type: "order", diff: 1, fmt: "Drag to sequence",
  q: "Put the phases of basic services under B101–2017 in order.",
  items: ["Schematic Design", "Design Development", "Construction Documents", "Procurement", "Construction"],
  explain: "B101–2017 Article 3 lists the phases in this order.",
  ref: "AIA B101–2017, Article 3" });

Q({ id: "q-pjm-12", div: "pjm", obj: "pjm-3.1", lesson: "pjm-contracts", type: "mc", diff: 2, fmt: "Multiple choice",
  q: "Under B101–2017, if the owner has not retained a cost consultant, who prepares the estimate of the Cost of the Work as part of basic services?",
  opts: ["The contractor", "The owner", "The architect", "No estimate is required"],
  ans: 2,
  why: ["There is no contractor during design in design-bid-build.",
    "The owner sets the budget but does not prepare the estimate.",
    "Correct. The architect prepares and updates the estimate at the end of SD, DD and CD unless the owner provides a cost consultant.",
    "B101 requires estimates as a basic service."],
  explain: "If the estimate exceeds the owner's budget, B101 sets out the owner's options and the architect's obligation to modify the documents.",
  ref: "AIA B101–2017, Article 6 (Cost of the Work)" });

Q({ id: "q-pjm-13", div: "pjm", obj: "pjm-4.4", lesson: "pjm-contracts", type: "mc", diff: 2, fmt: "Scenario",
  q: "A plans examiner's comment requires an additional exit stair based on an interpretation the architect believes is incorrect. What is the best FIRST step?",
  opts: ["Revise the drawings to comply and bill the owner", "Meet with the examiner, citing the specific code sections and the calculation, and document the outcome", "File an appeal with the board of appeals immediately", "Ask the contractor to resolve it during construction"],
  ans: 1,
  why: ["Complying without discussion may add cost unnecessarily.",
    "Correct. Most interpretations are resolved by discussion with the code official. Inform the owner and record the result.",
    "An appeal is the next step if discussion fails.",
    "Permit issues must be resolved before construction."],
  explain: "The building official interprets the code. Start with a documented technical discussion, then use the formal appeal process if needed.",
  ref: "2021 IBC, Chapter 1 (§104 duties of the building official; §113 board of appeals)" });

/* ---------------- PA ---------------- */
Q({ id: "q-pa-01", div: "pa", obj: "pa-2.2", lesson: "pa-zoning", type: "calc", diff: 1, fmt: "Calculation",
  q: "A 100 ft × 150 ft lot is zoned with a floor area ratio of 2.5. What is the maximum gross floor area permitted by FAR alone?",
  ans: 37500, tol: 1, unit: "sf",
  explain: "Lot area = 15,000 sf. Max GFA = 2.5 × 15,000 = 37,500 sf.",
  ref: "Local zoning ordinance (FAR definition)" });

Q({ id: "q-pa-02", div: "pa", obj: "pa-2.2", lesson: "pa-zoning", type: "calc", diff: 3, fmt: "Calculation",
  q: "A lot measures 80 ft wide × 160 ft deep. Zoning: FAR 2.0; maximum lot coverage 50%; height limit 3 stories; setbacks front 20 ft, rear 15 ft, each side 5 ft. Assuming each story uses the full allowable footprint, what is the maximum gross floor area?",
  ans: 19200, tol: 1, unit: "sf",
  explain: "Lot area = 12,800 sf. FAR → 25,600 sf. Coverage → 6,400 sf footprint. Setback envelope = 70 × 125 = 8,750 sf, so coverage governs the footprint. Height → 3 × 6,400 = 19,200 sf, which is less than the FAR limit. Maximum = 19,200 sf.",
  ref: "Local zoning ordinance" });

Q({ id: "q-pa-03", div: "pa", obj: "pa-2.3", lesson: "pa-zoning", type: "match", diff: 2, fmt: "Matching",
  q: "Match each situation to the zoning tool that addresses it.",
  pairs: [["An irregular lot makes the 25 ft rear setback unworkable", "Area (dimensional) variance"],
    ["The ordinance lists a daycare as allowed in the district subject to review and conditions", "Special (conditional) use permit"],
    ["A corner store built in 1955 in what is now a residential-only district", "Legal nonconforming use"],
    ["The owner wants the parcel reclassified from industrial to mixed-use", "Rezoning (map amendment)"]],
  explain: "Variances relieve dimensional hardship; conditional uses are anticipated by the ordinance; nonconforming uses predate current rules; rezoning changes the district itself.",
  ref: "Planning and Urban Design Standards — zoning administration" });

Q({ id: "q-pa-04", div: "pa", obj: "pa-4.3", lesson: "pa-program", type: "calc", diff: 1, fmt: "Calculation",
  q: "A program totals 21,000 net assignable square feet. The target efficiency ratio (net ÷ gross) is 0.75. What gross area should the architect plan for?",
  ans: 28000, tol: 1, unit: "gsf",
  explain: "Gross = net ÷ efficiency = 21,000 ÷ 0.75 = 28,000 gsf.",
  ref: "Pena & Parshall, Problem Seeking" });

Q({ id: "q-pa-05", div: "pa", obj: "pa-1.1", lesson: "pa-program", type: "mc", diff: 2, fmt: "Multiple choice",
  q: "In a hot climate in the northern hemisphere, which shading device is most effective for a west-facing window?",
  opts: ["A horizontal overhang", "Vertical fins", "A light shelf", "Clear glazing with an interior blind"],
  ans: 1,
  why: ["Low afternoon sun passes under horizontal overhangs on west faces.",
    "Correct. Vertical fins (ideally angled toward the north) block low-angle east and west sun.",
    "Light shelves redirect daylight; they are not primarily for low-angle sun control.",
    "Interior blinds stop glare but the heat is already inside."],
  explain: "Horizontal devices suit south faces; vertical devices suit east and west faces.",
  ref: "Brown & DeKay, Sun, Wind & Light" });

Q({ id: "q-pa-06", div: "pa", obj: "pa-1.2", lesson: "pa-program", type: "calc", diff: 2, fmt: "Calculation",
  q: "A proposed walk rises 3 ft over a horizontal distance of 60 ft. What is its slope, as a percentage?",
  ans: 5, tol: 0.05, unit: "%",
  explain: "Slope = 3 ÷ 60 × 100 = 5%. That is 1:20, the steepest running slope allowed for an accessible route before it must be designed as a ramp.",
  ref: "2010 ADA Standards §403.3" });

Q({ id: "q-pa-07", div: "pa", obj: "pa-3.2", lesson: "pa-program", type: "mc", diff: 2, fmt: "Multiple choice",
  q: "A lender requires an environmental assessment before purchase of a former gas station site. Which assessment involves collecting and testing soil and groundwater samples?",
  opts: ["Phase I Environmental Site Assessment", "Phase II Environmental Site Assessment", "A geotechnical boring log", "An ALTA/NSPS land title survey"],
  ans: 1,
  why: ["Phase I is records review, interviews and site reconnaissance; no sampling.",
    "Correct. Phase II samples and tests to confirm or rule out contamination flagged by Phase I.",
    "Geotechnical work tests soil for engineering properties, not contamination.",
    "A title survey maps boundaries, easements and improvements."],
  explain: "Phase I (per ASTM E1527) identifies recognized environmental conditions; Phase II (ASTM E1903) investigates them.",
  ref: "ASTM E1527-21 and E1903" });

Q({ id: "q-pa-08", div: "pa", obj: "pa-2.3", lesson: "pa-zoning", type: "mc", diff: 2, fmt: "Multiple choice",
  q: "Under a typical zoning ordinance, how does a legal nonconforming use most commonly lose its protected status?",
  opts: ["When the property is sold", "When the use is discontinued or abandoned for the period the ordinance sets", "When the zoning map is reprinted", "When the building is repainted"],
  ans: 1,
  why: ["Status normally runs with the land, not the owner.",
    "Correct. Abandonment beyond a set period (often 6–12 months) ends the protection.",
    "Reprinting the map has no effect.",
    "Ordinary maintenance is allowed."],
  explain: "Ordinances also commonly limit expansion and reconstruction after major damage.",
  ref: "Local zoning ordinance (nonconformities)" });

Q({ id: "q-pa-09", div: "pa", obj: "pa-4.1", lesson: "pa-program", type: "mc", diff: 3, fmt: "Scenario",
  q: "An owner wants to convert the upper floor of a 1970s office building into an event hall with movable seating. Which existing-building condition should the architect investigate FIRST?",
  opts: ["Exterior window style", "The floor structure's live load capacity", "Ceiling tile condition", "Carpet age"],
  ans: 1,
  why: ["Aesthetic items do not govern feasibility.",
    "Correct. Office floors are commonly designed for about 50 psf live load; assembly with movable seats requires about 100 psf under ASCE 7. Inadequate capacity can make the conversion infeasible.",
    "Finishes are replaceable.",
    "Finishes are replaceable."],
  explain: "Change of occupancy triggers structural, egress and fire-protection review. Structural capacity is the most expensive to fix.",
  ref: "ASCE 7-22, Table 4.3-1; 2021 IEBC (change of occupancy)" });

Q({ id: "q-pa-10", div: "pa", obj: "pa-2.1", lesson: "pa-zoning", type: "mc", diff: 2, fmt: "Code interpretation",
  q: "Under the 2021 IBC, a restaurant with an occupant load of 60 is most likely classified as which occupancy?",
  opts: ["Group B", "Group A-2", "Group M", "Group A-3"],
  ans: 1,
  why: ["A dining space with fewer than 50 occupants may be classified as Group B; 60 exceeds that.",
    "Correct. Restaurants and similar food and drink spaces are Group A-2.",
    "Group M is mercantile.",
    "Group A-3 covers worship, recreation and similar assembly uses not elsewhere classified."],
  explain: "Small assembly spaces under 50 occupants can be treated as Group B (IBC §303.1.1), but 60 occupants puts this restaurant in A-2.",
  ref: "2021 IBC §303.1.1 and §303.3" });

Q({ id: "q-pa-11", div: "pa", obj: "pa-1.1", lesson: "pa-program", type: "ms", diff: 2, fmt: "Check all that apply", pick: 3,
  q: "Which three strategies suit a hot-arid climate? Select three.",
  opts: ["High thermal mass walls with night ventilation", "Shaded courtyards", "Lightweight, raised construction to catch breezes", "Small, shaded openings", "Large unshaded west-facing glazing"],
  ans: [0, 1, 3],
  why: ["Correct. Mass absorbs daytime heat; cool night air flushes it.", "Correct.", "This suits hot-humid climates, where large day–night swings are absent.", "Correct.", "This maximizes unwanted heat gain."],
  explain: "Hot-arid climates have large daily temperature swings, which thermal mass exploits.",
  ref: "Brown & DeKay, Sun, Wind & Light" });

Q({ id: "q-pa-12", div: "pa", obj: "pa-1.2", lesson: "pa-program", type: "mc", diff: 1, fmt: "Diagram interpretation",
  q: "On a topographic survey, contour lines are drawn very close together in one area of the site. What does this indicate?",
  opts: ["A flat area", "A steep slope", "A drainage swale", "A wetland"],
  ans: 1,
  why: ["Flat areas show widely spaced contours.", "Correct. Close spacing means a large change in elevation over a short distance.", "A swale shows as contours that point uphill.", "Wetlands are shown by symbols or delineation lines."],
  explain: "Contour spacing is inversely related to slope.",
  ref: "Ching, Site Planning concepts; Planning and Urban Design Standards" });

/* QUESTION BANK — PPD, PDD, CE */

/* ---------------- PPD ---------------- */
Q({ id: "q-ppd-01", div: "ppd", obj: "ppd-2.2", lesson: "ppd-egress", type: "calc", diff: 1, fmt: "Code calculation",
  q: "Using a load factor of 150 sf gross per occupant for business areas (2021 IBC Table 1004.5), what is the occupant load of a 30,000 sf gross office floor?",
  ans: 200, tol: 0, unit: "occupants",
  explain: "30,000 ÷ 150 = 200 occupants.",
  ref: "2021 IBC Table 1004.5" });

Q({ id: "q-ppd-02", div: "ppd", obj: "ppd-2.2", lesson: "ppd-egress", type: "calc", diff: 2, fmt: "Code calculation",
  q: "A community hall has a 2,400 sf net dining area with tables and chairs (15 sf net per occupant) and an 800 sf commercial kitchen (200 sf gross per occupant). What is the total occupant load?",
  ans: 164, tol: 0, unit: "occupants",
  explain: "Dining: 2,400 ÷ 15 = 160. Kitchen: 800 ÷ 200 = 4. Total = 164. Calculate each function separately, then add.",
  ref: "2021 IBC §1004.5 and Table 1004.5" });

Q({ id: "q-ppd-03", div: "ppd", obj: "ppd-2.2", lesson: "ppd-egress", type: "calc", diff: 2, fmt: "Code calculation",
  q: "A stair serves 240 occupants in a sprinklered building that has no emergency voice/alarm communication system. Using 0.3 in per occupant, what egress capacity (in inches) must the stair provide before checking code minimum widths?",
  ans: 72, tol: 0, unit: "in",
  explain: "240 × 0.3 = 72 in. The reduced 0.2 in factor requires both sprinklers and an emergency voice/alarm system, so it does not apply here.",
  ref: "2021 IBC §1005.3.1" });

Q({ id: "q-ppd-04", div: "ppd", obj: "ppd-3.4", lesson: "ppd-envelope", type: "calc", diff: 2, fmt: "Calculation",
  q: "A wall consists of: inside air film R-0.68, gypsum board R-0.45, cavity insulation R-13, sheathing R-0.62, continuous insulation R-5.0, outside air film R-0.17. Ignoring framing, what is the U-factor? (Three decimals.)",
  ans: 0.050, tol: 0.0015, unit: "Btu/h·ft²·°F",
  explain: "R_T = 0.68 + 0.45 + 13 + 0.62 + 5.0 + 0.17 = 19.92. U = 1 ÷ 19.92 ≈ 0.050.",
  ref: "ASHRAE Handbook—Fundamentals, Ch. 25–27" });

Q({ id: "q-ppd-05", div: "ppd", obj: "ppd-3.4", lesson: "ppd-envelope", type: "calc", diff: 2, fmt: "Calculation",
  q: "A 1,500 sf wall with a U-factor of 0.05 separates a 70°F interior from 10°F outdoor air. What is the conductive heat loss through the wall?",
  ans: 4500, tol: 1, unit: "Btu/h",
  explain: "Q = U × A × ΔT = 0.05 × 1,500 × (70 − 10) = 4,500 Btu/h.",
  ref: "ASHRAE Handbook—Fundamentals" });

Q({ id: "q-ppd-06", div: "ppd", obj: "ppd-3.4", lesson: "ppd-envelope", type: "mc", diff: 2, fmt: "Multiple choice",
  q: "For large west-facing windows on an office in a cooling-dominated climate, which glazing properties are most appropriate?",
  opts: ["High SHGC, high VT", "Low SHGC, high VT", "High SHGC, low VT", "Low U-factor only; SHGC does not matter"],
  ans: 1,
  why: ["High SHGC admits afternoon solar heat.", "Correct. Low SHGC limits heat gain; high VT keeps daylight.", "This admits heat while blocking light, the worst combination.", "In cooling climates solar gain usually matters more than conduction."],
  explain: "Look for a high light-to-solar-gain ratio (VT ÷ SHGC).",
  ref: "2021 IECC Table C402.4 (fenestration)" });

Q({ id: "q-ppd-07", div: "ppd", obj: "ppd-2.2", lesson: "ppd-egress", type: "hot", diff: 2, fmt: "Hotspot",
  q: "The plan shows a 120 ft × 90 ft open floor in a building <b>without</b> sprinklers. Exit 1 is at the lower-left corner. Two exits are required. Click the only candidate location (A, B or C) that satisfies the remoteness requirement for the second exit.",
  svg: `<svg viewBox="0 0 520 380" role="img" aria-label="Floor plan 120 by 90 feet with exit 1 and three candidate exit locations">
<g class="dg-text" font-size="12">
<rect x="40" y="30" width="440" height="330" class="dg-soft"/>
<line x1="40" y1="360" x2="480" y2="30" class="dg-line" stroke-dasharray="6 4"/>
<rect x="40" y="346" width="26" height="14" class="dg-accent"/><text x="46" y="376">Exit 1</text>
<g class="hs" data-hs="A" tabindex="0" role="button" aria-label="Location A"><circle cx="187" cy="360" r="16" class="hs-dot"/><text x="187" y="365" text-anchor="middle">A</text></g>
<g class="hs" data-hs="B" tabindex="0" role="button" aria-label="Location B"><circle cx="40" cy="140" r="16" class="hs-dot"/><text x="40" y="145" text-anchor="middle">B</text></g>
<g class="hs" data-hs="C" tabindex="0" role="button" aria-label="Location C"><circle cx="333" cy="30" r="16" class="hs-dot"/><text x="333" y="35" text-anchor="middle">C</text></g>
<text x="260" y="22" text-anchor="middle" font-size="11">120 ft</text><text x="490" y="200" font-size="11">90 ft</text>
<text x="200" y="120" font-size="11">A: 40 ft from Exit 1 · B: 60 ft · C: about 120 ft</text>
</g></svg>`,
  ans: "C",
  explain: "Diagonal = √(120² + 90²) = 150 ft. Without sprinklers, exits must be at least ½ × 150 = 75 ft apart. A (40 ft) and B (60 ft) fail; C (about 120 ft) complies. With sprinklers the requirement would drop to 50 ft and B would also comply.",
  ref: "2021 IBC §1007.1.1" });

Q({ id: "q-ppd-08", div: "ppd", obj: "ppd-2.3", lesson: "ppd-egress", type: "mc", diff: 1, fmt: "Multiple choice",
  q: "What is the maximum running slope of a ramp on an accessible route under the 2010 ADA Standards?",
  opts: ["1:8", "1:10", "1:12", "1:20"],
  ans: 2,
  why: ["Too steep for new construction (limited allowances exist for some existing conditions).", "Too steep.", "Correct. 1:12 (8.33%).", "1:20 is the limit for a walk before it becomes a ramp."],
  explain: "Ramps also limit rise to 30 in per run and need 60 in landings.",
  ref: "2010 ADA Standards §405.2" });

Q({ id: "q-ppd-09", div: "ppd", obj: "ppd-3.2", lesson: "ppd-envelope", type: "mc", diff: 3, fmt: "Scenario",
  q: "A three-story steel-framed retail building needs a fully glazed, open ground-floor storefront on all street faces. Which lateral force-resisting system best preserves the open facade?",
  opts: ["Concrete shear walls at the perimeter", "Concentrically braced frames at the storefront", "Moment-resisting frames", "Load-bearing masonry walls"],
  ans: 2,
  why: ["Perimeter shear walls block the storefront.", "Diagonal bracing obstructs the glazing.", "Correct. Rigid beam-to-column connections resist lateral loads without walls or braces, keeping bays open.", "Bearing walls close the facade."],
  explain: "Moment frames cost more and drift more than braced frames or shear walls, but they leave openings clear.",
  ref: "Ching, Building Structures Illustrated; AISC 341 (concepts)" });

Q({ id: "q-ppd-10", div: "ppd", obj: "ppd-2.2", lesson: "ppd-egress", type: "mc", diff: 2, fmt: "Code interpretation",
  q: "In a Group B office building equipped throughout with an automatic sprinkler system, what is the maximum length of a dead-end corridor under the 2021 IBC?",
  opts: ["20 ft", "35 ft", "50 ft", "75 ft"],
  ans: 2,
  why: ["20 ft is the general limit.", "Not a value used for this rule.", "Correct. The 50 ft allowance applies to Group B (and several other groups) in sprinklered buildings.", "Not a value used for this rule."],
  explain: "Dead ends trap occupants who choose the wrong direction; sprinklers justify a longer allowance.",
  ref: "2021 IBC §1020.5 (dead ends)" });

Q({ id: "q-ppd-11", div: "ppd", obj: "ppd-5.3", lesson: "ppd-envelope", type: "calc", diff: 3, fmt: "Calculation",
  q: "Mechanical option A costs $100,000 installed and $12,000/yr to operate. Option B costs $130,000 and $8,000/yr. Ignoring the time value of money, what is the simple payback period of option B relative to option A?",
  ans: 7.5, tol: 0.05, unit: "years",
  explain: "Extra first cost = 30,000. Annual savings = 4,000. Payback = 30,000 ÷ 4,000 = 7.5 years. A full life-cycle cost analysis would discount future savings to present value.",
  ref: "ASTM E917 (life-cycle cost concepts)" });

Q({ id: "q-ppd-12", div: "ppd", obj: "ppd-2.2", lesson: "ppd-egress", type: "mc", diff: 2, fmt: "Code interpretation",
  q: "A story has an occupant load of 620. What is the minimum number of exits from the story under the 2021 IBC?",
  opts: ["2", "3", "4", "5"],
  ans: 1,
  why: ["Two exits serve 1–500 occupants.", "Correct. 501–1,000 occupants require at least three exits.", "Four are required above 1,000.", "No such threshold."],
  explain: "2021 IBC Table 1006.3.3 sets 2/3/4 exits at 1–500/501–1,000/over 1,000 occupants per story.",
  ref: "2021 IBC §1006.3.3 (Table 1006.3.3)" });

Q({ id: "q-ppd-13", div: "ppd", obj: "ppd-2.2", lesson: "ppd-egress", type: "ms", diff: 2, fmt: "Check all that apply", pick: 2,
  q: "Which two conditions can increase a building's allowable area beyond the tabular value in the 2021 IBC? Select two.",
  opts: ["Open frontage along a public way or open space", "A higher occupant load", "An automatic sprinkler system throughout (where not already required for the tabular value)", "A fire alarm system", "Use of Type V-B construction"],
  ans: [0, 2],
  why: ["Correct. Frontage increase under §506.3.", "Occupant load does not increase area.", "Correct. Sprinkler increases are built into Table 506.2 values (S1, SM).", "Fire alarms do not increase area.", "Type V-B has the lowest allowable areas."],
  explain: "Allowable area depends on occupancy, construction type, sprinklers and frontage.",
  ref: "2021 IBC §506" });

/* ---------------- PDD ---------------- */
Q({ id: "q-pdd-01", div: "pdd", obj: "pdd-2.3", lesson: "pdd-envelope", type: "hot", diff: 2, fmt: "Hotspot",
  q: "Click the layer in this wall section that acts as the continuous air and water-resistive barrier.",
  svg: `<svg viewBox="0 0 420 260" role="img" aria-label="Wall section with seven selectable layers">
<g class="dg-text" font-size="11">
<g class="hs" data-hs="gyp" tabindex="0" role="button" aria-label="Layer 1"><rect x="40" y="20" width="22" height="200" class="dg-soft hs-r"/></g>
<g class="hs" data-hs="ins" tabindex="0" role="button" aria-label="Layer 2"><rect x="62" y="20" width="80" height="200" class="dg-hatch hs-r"/></g>
<g class="hs" data-hs="sh" tabindex="0" role="button" aria-label="Layer 3"><rect x="142" y="20" width="16" height="200" class="dg-soft hs-r"/></g>
<g class="hs" data-hs="awb" tabindex="0" role="button" aria-label="Layer 4"><rect x="158" y="20" width="14" height="200" class="dg-accent2 hs-r"/></g>
<g class="hs" data-hs="ci" tabindex="0" role="button" aria-label="Layer 5"><rect x="172" y="20" width="50" height="200" class="dg-soft hs-r"/></g>
<g class="hs" data-hs="cav" tabindex="0" role="button" aria-label="Layer 6"><rect x="222" y="20" width="24" height="200" class="dg-air hs-r"/></g>
<g class="hs" data-hs="clad" tabindex="0" role="button" aria-label="Layer 7"><rect x="246" y="20" width="22" height="200" class="dg-soft hs-r"/></g>
<text x="51" y="240" text-anchor="middle">1</text><text x="102" y="240" text-anchor="middle">2</text><text x="150" y="240" text-anchor="middle">3</text>
<text x="165" y="240" text-anchor="middle">4</text><text x="197" y="240" text-anchor="middle">5</text><text x="234" y="240" text-anchor="middle">6</text><text x="257" y="240" text-anchor="middle">7</text>
<text x="290" y="60">Interior ←</text><text x="290" y="80">→ Exterior</text>
<text x="290" y="120" font-size="10">Layers are unlabeled;</text><text x="290" y="134" font-size="10">identify by position.</text>
</g></svg>`,
  ans: "awb",
  explain: "Layer 4, applied to the face of the sheathing (3) and behind the exterior insulation (5), is the air and water-resistive barrier. Placing it inboard of the continuous insulation keeps it warm and protected; the drained cavity (6) behind the cladding (7) lets water escape.",
  ref: "BSC Building Science Digest on control layers; 2021 IBC §1403.2" });

Q({ id: "q-pdd-02", div: "pdd", obj: "pdd-2.3", lesson: "pdd-envelope", type: "mc", diff: 2, fmt: "Multiple choice",
  q: "In a cold, heating-dominated climate with no exterior continuous insulation, where should a Class I or II vapor retarder be placed in a framed wall?",
  opts: ["On the exterior face of the sheathing", "On the interior (warm) side of the insulation", "In the middle of the insulation", "A vapor retarder should not be used in cold climates"],
  ans: 1,
  why: ["An exterior low-perm layer traps interior moisture in the cold sheathing.", "Correct. Winter vapor drive is from the warm, humid interior outward.", "Mid-cavity placement leaves cold surfaces exposed to interior vapor.", "Codes require vapor retarders in cold climate zones for framed walls (with exceptions)."],
  explain: "Place vapor control where it keeps moist air from reaching surfaces colder than its dew point.",
  ref: "2021 IBC §1404.3 (vapor retarders by climate zone)" });

Q({ id: "q-pdd-03", div: "pdd", obj: "pdd-2.3", lesson: "pdd-envelope", type: "match", diff: 1, fmt: "Matching",
  q: "Match each vapor retarder class to its permeance range.",
  pairs: [["Class I", "0.1 perm or less"], ["Class II", "Greater than 0.1 and up to 1.0 perm"], ["Class III", "Greater than 1.0 and up to 10 perm"]],
  explain: "Lower permeance means less vapor passes through. Polyethylene is Class I; kraft facing is Class II; latex paint is Class III.",
  ref: "2021 IBC §202 definitions; §1404.3" });

Q({ id: "q-pdd-04", div: "pdd", obj: "pdd-3.1", lesson: "pdd-specs", type: "match", diff: 2, fmt: "Drag and place",
  q: "Place each article in the correct part of a three-part specification section.",
  pairs: [["Submittals", "Part 1 — General"], ["Warranty", "Part 1 — General"], ["Manufacturers", "Part 2 — Products"], ["Installation", "Part 3 — Execution"], ["Field quality control", "Part 3 — Execution"]],
  explain: "Part 1 covers administrative requirements; Part 2 products and materials; Part 3 work at the site.",
  ref: "CSI SectionFormat" });

Q({ id: "q-pdd-05", div: "pdd", obj: "pdd-3.1", lesson: "pdd-specs", type: "match", diff: 2, fmt: "Drag and place",
  q: "Place each item in its MasterFormat division.",
  pairs: [["Gypsum board", "09 Finishes"], ["Hollow metal doors and frames", "08 Openings"], ["Modified bituminous roofing", "07 Thermal & Moisture Protection"], ["Toilet compartments", "10 Specialties"], ["Cast-in-place concrete", "03 Concrete"]],
  explain: "Curtain walls and storefronts also fall in Division 08; sealants and firestopping in Division 07.",
  ref: "CSI MasterFormat" });

Q({ id: "q-pdd-06", div: "pdd", obj: "pdd-3.2", lesson: "pdd-specs", type: "mc", diff: 2, fmt: "Scenario",
  q: "A public owner requires open competition. The design calls for a curtain wall to be engineered by the manufacturer to meet stated wind load, water penetration and thermal criteria. Which specifying method fits best?",
  opts: ["Closed proprietary", "Descriptive", "Performance", "Base bid with a single named product"],
  ans: 2,
  why: ["Closed specs defeat competition.", "Describing every component removes the manufacturer's engineering role.", "Correct. Performance criteria let qualified manufacturers compete and engineer the system (delegated design).", "A single named product limits competition."],
  explain: "Performance specs state required results and how they will be verified.",
  ref: "CSI Project Delivery Practice Guide" });

Q({ id: "q-pdd-07", div: "pdd", obj: "pdd-2.4", lesson: "pdd-specs", type: "mc", diff: 1, fmt: "Multiple choice",
  q: "Under the US National CAD Standard sheet numbering, what does sheet A-501 most likely contain?",
  opts: ["Architectural floor plans", "Architectural elevations", "Architectural details", "Architectural schedules"],
  ans: 2,
  why: ["Plans are sheet type 1 (A-101).", "Elevations are type 2.", "Correct. Type 5 is details.", "Schedules and diagrams are type 6."],
  explain: "Sheet types: 0 general, 1 plans, 2 elevations, 3 sections, 4 large-scale views, 5 details, 6 schedules and diagrams.",
  ref: "US National CAD Standard — Uniform Drawing System" });

Q({ id: "q-pdd-08", div: "pdd", obj: "pdd-3.3", lesson: "pdd-specs", type: "mc", diff: 2, fmt: "Multiple choice",
  q: "Which information belongs in the specifications rather than on the drawings?",
  opts: ["The location of control joints in a slab", "The required ASTM standard and movement class for exterior sealant", "The dimension from grid line to a wall face", "The number of windows on the east elevation"],
  ans: 1,
  why: ["Location belongs on drawings.", "Correct. Quality and standards belong in specifications.", "Dimensions belong on drawings.", "Quantity and arrangement belong on drawings."],
  explain: "Drawings: quantity, location, size, relationships. Specs: quality, materials, workmanship.",
  ref: "CSI Project Delivery Practice Guide" });

Q({ id: "q-pdd-09", div: "pdd", obj: "pdd-1.5", lesson: "pdd-envelope", type: "mc", diff: 3, fmt: "Detail diagnosis",
  q: "Sealant in a precast panel joint has torn along its centre a year after installation. The sealant was installed directly against the back of the joint with no backer. What most likely caused the failure?",
  opts: ["Excess sealant depth only", "Three-sided adhesion prevented the sealant from stretching", "Ultraviolet exposure", "Use of a backer rod"],
  ans: 1,
  why: ["Depth matters, but the key error is bonding to the back of the joint.", "Correct. Bonding to three surfaces restrains the bead; it tears when the joint opens.", "UV degrades sealants over longer periods and affects the surface first.", "A backer rod (or bond breaker tape) is the fix, not the cause."],
  explain: "Sealant should bond to the two joint faces only, with a backer rod or bond breaker controlling depth and shape.",
  ref: "ASTM C1193 (guide for use of joint sealants)" });

Q({ id: "q-pdd-10", div: "pdd", obj: "pdd-4.1", lesson: "pdd-envelope", type: "mc", diff: 2, fmt: "Code interpretation",
  q: "A plumbing pipe passes through a 1-hour fire-resistance-rated wall. How must the penetration be protected under the IBC?",
  opts: ["With any acoustical sealant", "With a tested through-penetration firestop system (e.g., ASTM E814 or UL 1479) or as the code otherwise allows", "By wrapping the pipe in fiberglass insulation", "No protection is needed for walls rated less than 2 hours"],
  ans: 1,
  why: ["Acoustical sealant is not a tested firestop.", "Correct. Penetrations must maintain the rating, generally through a listed system tested to ASTM E814 / UL 1479.", "Insulation alone is not a firestop.", "Rated walls of any rating require penetration protection."],
  explain: "Detail firestop systems by listing number on the drawings and coordinate them with the specification.",
  ref: "2021 IBC §714" });

Q({ id: "q-pdd-11", div: "pdd", obj: "pdd-5.1", lesson: "pdd-specs", type: "calc", diff: 2, fmt: "Calculation",
  q: "A quantity takeoff shows 2,400 sf of partition at a unit cost of $14.00/sf. Adding an 8% design contingency, what is the estimated cost?",
  ans: 36288, tol: 1, unit: "$",
  explain: "2,400 × 14 = 33,600. 33,600 × 1.08 = $36,288.",
  ref: "RSMeans (unit cost estimating concepts)" });

Q({ id: "q-pdd-12", div: "pdd", obj: "pdd-2.5", lesson: "pdd-specs", type: "mc", diff: 2, fmt: "Multiple choice",
  q: "After the drawings are issued for construction, a sheet is revised. How should the change be identified on the reissued sheet?",
  opts: ["Redraw the sheet with no markings so it is clean", "Enclose the change in a revision cloud with a revision symbol and record it in the sheet's revision block", "Note the change only in a separate memo", "Change the sheet number"],
  ans: 1,
  why: ["Unmarked changes are easily missed and cause disputes.", "Correct. Clouds, delta symbols and the revision block create a clear record.", "A memo alone leaves the sheet ambiguous.", "Sheet numbers stay constant so cross-references remain valid."],
  explain: "Changes after bidding are issued through an ASI, bulletin or change order, with the revised sheets attached.",
  ref: "US National CAD Standard — drafting conventions" });

/* ---------------- CE ---------------- */
Q({ id: "q-ce-01", div: "ce", obj: "ce-2.1", lesson: "ce-admin", type: "mc", diff: 1, fmt: "Multiple choice",
  q: "Under A201–2017, what is the purpose of the architect's site visits during construction?",
  opts: ["To supervise the contractor's work continuously", "To become generally familiar with progress and quality and determine, in general, whether the work observed conforms to the contract documents", "To direct construction means and methods", "To enforce jobsite safety"],
  ans: 1,
  why: ["Not required to make exhaustive or continuous inspections.", "Correct.", "Means and methods are the contractor's responsibility.", "Safety is the contractor's responsibility."],
  explain: "Staying within this defined role limits the architect's liability.",
  ref: "AIA A201–2017, §4.2.2" });

Q({ id: "q-ce-02", div: "ce", obj: "ce-3.1", lesson: "ce-admin", type: "mc", diff: 2, fmt: "Multiple choice",
  q: "Who must sign a Construction Change Directive (G714) for it to be effective under A201–2017?",
  opts: ["Owner, contractor and architect", "Owner and architect", "Architect only", "Contractor and architect"],
  ans: 1,
  why: ["Three signatures make it a change order.", "Correct. The contractor's signature is not required; signing indicates agreement with the adjustment.", "An architect alone can issue only minor changes (ASI).", "The owner must authorize changes affecting the contract."],
  explain: "A CCD lets work proceed before the price is agreed.",
  ref: "AIA A201–2017, §7.3" });

Q({ id: "q-ce-03", div: "ce", obj: "ce-3.2", lesson: "ce-admin", type: "mc", diff: 2, fmt: "Scenario",
  q: "A shop drawing showed a smaller anchor than specified. The contractor did not identify the deviation, and the architect stamped the submittal 'reviewed, no exceptions.' Who is responsible for the deviation?",
  opts: ["The architect, because the drawing was approved", "The contractor, because deviations must be specifically identified in writing and specifically approved", "The owner", "The anchor manufacturer"],
  ans: 1,
  why: ["Approval does not relieve the contractor of deviations not identified.", "Correct.", "The owner did not create or approve the deviation.", "The manufacturer may have contract obligations to the contractor, but under A201 the contractor remains responsible."],
  explain: "Submittal review is limited; contractors must call out deviations in writing.",
  ref: "AIA A201–2017, §3.12.8" });

Q({ id: "q-ce-04", div: "ce", obj: "ce-3.3", lesson: "ce-payment", type: "calc", diff: 2, fmt: "Calculation",
  q: "Application for payment: work completed to date $820,000; materials suitably stored $30,000; retainage 5%; previous certificates for payment $640,000. What is the current payment due?",
  ans: 167500, tol: 1, unit: "$",
  explain: "Total completed and stored = 850,000. Retainage = 42,500. Earned less retainage = 807,500. Current payment = 807,500 − 640,000 = $167,500.",
  ref: "AIA G702" });

Q({ id: "q-ce-05", div: "ce", obj: "ce-4.1", lesson: "ce-payment", type: "order", diff: 2, fmt: "Drag to sequence",
  q: "Put these closeout steps in order under A201–2017.",
  items: ["Contractor notifies that the work is substantially complete and submits its list of items to be completed or corrected",
    "Architect inspects to determine whether the work is substantially complete",
    "Architect issues the Certificate of Substantial Completion",
    "Contractor completes the list items and gives notice that the work is ready for final inspection",
    "Contractor submits closeout documents (payment affidavit, lien releases, consent of surety)",
    "Architect issues the final Certificate for Payment"],
  explain: "Substantial completion comes first and starts warranties; final payment requires the closeout documents.",
  ref: "AIA A201–2017, §9.8 and §9.10" });

Q({ id: "q-ce-06", div: "ce", obj: "ce-3.3", lesson: "ce-payment", type: "ms", diff: 2, fmt: "Check all that apply", pick: 3,
  q: "Which three are grounds for the architect to withhold certification of payment under A201–2017? Select three.",
  opts: ["Defective work not remedied", "The contractor uses a construction sequence the architect would not have chosen", "Failure of the contractor to make payments to subcontractors", "Third-party claims filed or reasonable evidence they will be filed", "The owner's lender is late releasing funds"],
  ans: [0, 2, 3],
  why: ["Correct.", "Sequence is the contractor's choice.", "Correct.", "Correct.", "Owner financing is not a ground under §9.5.1."],
  explain: "Withholding protects the owner from loss tied to the contractor's performance.",
  ref: "AIA A201–2017, §9.5.1" });

Q({ id: "q-ce-07", div: "ce", obj: "ce-1.2", lesson: "ce-payment", type: "mc", diff: 2, fmt: "Multiple choice",
  q: "What does a bid bond guarantee?",
  opts: ["That the contractor will complete the work as specified", "That subcontractors and suppliers will be paid", "That the bidder, if awarded, will enter into the contract and furnish the required performance and payment bonds", "That the work will be free of defects for one year"],
  ans: 2,
  why: ["That is a performance bond.", "That is a payment bond.", "Correct.", "That is the correction period, not a bond."],
  explain: "If the low bidder refuses to sign, the bid bond compensates the owner, typically up to the difference to the next bid within the bond amount.",
  ref: "AIA A310 (Bid Bond); A701" });

Q({ id: "q-ce-08", div: "ce", obj: "ce-1.1", lesson: "ce-admin", type: "mc", diff: 2, fmt: "Multiple choice",
  q: "The architect must correct a door hardware set in the documents while the project is out to bid. How is this issued?",
  opts: ["Change order", "Addendum", "Architect's supplemental instruction", "Construction change directive"],
  ans: 1,
  why: ["Change orders modify an executed contract.", "Correct. Addenda modify the bidding documents before bids are received.", "ASIs are issued during construction.", "CCDs are issued during construction."],
  explain: "Issue addenda early enough for bidders to price them, and require bidders to acknowledge each addendum on the bid form.",
  ref: "AIA A701–2018 (Instructions to Bidders)" });

Q({ id: "q-ce-09", div: "ce", obj: "ce-1.3", lesson: "ce-payment", type: "mc", diff: 3, fmt: "Bid analysis",
  q: "Bids: Contractor A base $1,000,000, Alternate 1 add $40,000. Contractor B base $980,000, Alt 1 add $70,000. Contractor C base $1,010,000, Alt 1 add $20,000. The owner accepts Alternate 1. Who is the low bidder?",
  opts: ["Contractor A ($1,040,000)", "Contractor B ($1,050,000)", "Contractor C ($1,030,000)", "Contractor B, because its base bid is lowest"],
  ans: 2,
  why: ["A totals $1,040,000.", "B totals $1,050,000.", "Correct. C totals $1,030,000, the lowest with the accepted alternate.", "Award is based on base bid plus accepted alternates."],
  explain: "Owners should decide which alternates to accept in the order listed or by a stated rule, to prevent manipulation of the low bidder.",
  ref: "AIA A701–2018" });

Q({ id: "q-ce-10", div: "ce", obj: "ce-3.1", lesson: "ce-admin", type: "mc", diff: 2, fmt: "Multiple choice",
  q: "Under A201–2017, within what period must a claim be initiated after the event giving rise to it (or after the claimant first recognizes the condition)?",
  opts: ["7 days", "14 days", "21 days", "30 days"],
  ans: 2,
  why: ["Too short.", "Too short.", "Correct.", "Not the A201–2017 period."],
  explain: "Missing the notice period can waive a claim. CCDC 2 and other contracts use different periods.",
  ref: "AIA A201–2017, Article 15" });

Q({ id: "q-ce-11", div: "ce", obj: "ce-4.1", lesson: "ce-payment", type: "mc", diff: 1, fmt: "Multiple choice",
  q: "Under A201–2017, the contractor's one-year obligation to correct work begins on what date?",
  opts: ["Contract signing", "Date of substantial completion", "Date of final payment", "Date of first occupancy permit application"],
  ans: 1,
  why: ["Too early.", "Correct.", "Final payment does not start the correction period.", "Not the trigger."],
  explain: "The one-year correction period is separate from, and does not limit, other warranties or the owner's legal rights.",
  ref: "AIA A201–2017, §12.2.2" });

Q({ id: "q-ce-12", div: "ce", obj: "ce-3.4", lesson: "ce-admin", type: "mc", diff: 2, fmt: "Scenario",
  q: "Cylinder test results show concrete in a footing below the specified 28-day strength. What should the architect do?",
  opts: ["Order the contractor to stop all work", "Reject the work, notify the owner and contractor, and require additional testing or engineering evaluation", "Accept the work because footings are concealed", "Direct the contractor's crew to remove the footing"],
  ans: 1,
  why: ["Under A201 §2.4 the right to stop the work belongs to the owner.", "Correct. The architect may reject nonconforming work and require testing; the structural engineer evaluates whether cores or remediation are needed.", "Acceptance of defective work needs the owner's decision and normally a price adjustment.", "Directing the crew is means and methods."],
  explain: "Reject, report, and let the engineer determine the remedy.",
  ref: "AIA A201–2017, §4.2.6, §2.4 and §13.4" });

Q({ id: "q-ce-13", div: "ce", obj: "ce-1.3", lesson: "ce-payment", type: "mc", diff: 2, fmt: "Calculation",
  q: "The contract includes a $20,000 allowance for light fixtures. The fixtures the owner selects cost $26,000 delivered to the site. What happens?",
  opts: ["The contractor absorbs the $6,000", "The contract sum is increased by $6,000 by change order", "The architect pays the difference", "The allowance is cancelled and the item rebid"],
  ans: 1,
  why: ["Allowances adjust to actual cost.", "Correct. A201 adjusts the contract sum by change order for the difference between actual cost and the allowance.", "The architect has no payment obligation.", "No rebid is needed."],
  explain: "Under A201, allowances cover the cost of materials delivered (less discounts); installation, overhead and profit are included in the contract sum, not the allowance.",
  ref: "AIA A201–2017, §3.8" });

ARE.LESSONS.push({
  id: "pcm-firm", div: "pcm", obj: ["pcm-1.1", "pcm-1.2", "pcm-2.3", "pcm-4.2"], title: "Running the Firm: People, Law & Growth",
  minutes: 35, level: "Practice",
  summary: "How a firm staffs, follows employment law, plans strategically, and wins work through marketing and business development.",
  objectives: [
    "Apply the main federal employment laws by firm size and classify employees correctly.",
    "Explain the difference between an employee and an independent contractor.",
    "Describe a strategic plan, a marketing plan and a go/no-go decision for pursuing work.",
    "Explain qualifications-based selection and how public owners hire architects."
  ],
  why: "A firm's most important asset is its people, and its future depends on a steady pipeline of the right projects. Both are managed deliberately in well-run firms.",
  exam: "Items describe a staffing or hiring situation and ask which law applies, or describe a pursuit and ask whether to bid, how to price it, or how the owner will select.",
  body: `
<h3>Employment law the exam expects (US federal, simplified)</h3>
<table class="tbl"><thead><tr><th>Law</th><th>What it governs</th><th>Applies to</th></tr></thead><tbody>
<tr><td>Fair Labor Standards Act (FLSA)</td><td>Minimum wage; overtime at 1.5× for non-exempt employees over 40 hours/week</td><td>Most employers</td></tr>
<tr><td>Title VII, Civil Rights Act</td><td>Discrimination by race, color, religion, sex, national origin</td><td>15+ employees</td></tr>
<tr><td>Americans with Disabilities Act, Title I</td><td>Employment discrimination; reasonable accommodation</td><td>15+ employees</td></tr>
<tr><td>Age Discrimination in Employment Act</td><td>Protects workers 40 and older</td><td>20+ employees</td></tr>
<tr><td>Family and Medical Leave Act</td><td>Up to 12 weeks unpaid, job-protected leave</td><td>50+ employees</td></tr>
<tr><td>Occupational Safety and Health Act</td><td>Safe workplace, recordkeeping</td><td>Most employers</td></tr>
</tbody></table>
<p>Whether an employee is <strong>exempt</strong> from overtime depends on salary level and duties, not job title. Interns and junior staff are usually <strong>non-exempt</strong>, so unpaid overtime is a legal risk. ADA <strong>Title III</strong> (public accommodations) is the part that governs building design; Title I governs the firm as an employer.</p>
<p>An <strong>independent contractor</strong> controls how and when the work is done, uses their own tools and serves other clients. If the firm controls the work like an employer, the worker is an employee regardless of the label, and misclassification brings back taxes and penalties.</p>

<h3>Strategic and business planning</h3>
<p>A <strong>strategic plan</strong> states where the firm wants to be (markets, size, services, ownership transition) over several years. A <strong>SWOT analysis</strong> (strengths, weaknesses, opportunities, threats) is a common starting tool. The <strong>business plan</strong> turns strategy into budgets and targets; the <strong>marketing plan</strong> names target clients and markets and the activities to reach them. Ownership <strong>succession</strong> planning should start years before principals retire.</p>

<h3>Winning work</h3>
<p><strong>Marketing</strong> builds the firm's reputation in chosen markets; <strong>business development</strong> pursues specific projects. Before pursuing, make a <strong>go/no-go decision</strong>: fit with strategy, relationship with the client, competition, available staff, fee potential and risk.</p>
<p>Public owners often use <strong>qualifications-based selection (QBS)</strong>: rank firms on qualifications first, then negotiate a fee with the top-ranked firm, moving to the next only if negotiation fails. US federal agencies must use QBS for architect-engineer services under the <strong>Brooks Act</strong>, and many states have similar laws. An <strong>RFQ</strong> asks for qualifications; an <strong>RFP</strong> asks for a proposal that may include approach and fee.</p>`,
  diagram: "",
  formulas: [
    { name: "Win rate", f: "Win rate = Proposals won ÷ Proposals submitted" },
    { name: "Backlog (months)", f: "Backlog = Remaining contracted fee ÷ Average monthly NOR" }
  ],
  example: { title: "Applying it", html: `<p>A 12-person firm receives an RFP for a hospital addition. It has never designed health care, its two senior staff are fully booked, and the fee is a fixed lump sum. A disciplined go/no-go review says no, or yes only with a health-care partner firm. Chasing work outside the firm's capacity and expertise raises risk more than it raises revenue.</p>` },
  mistakes: [
    "Treating a salaried employee as exempt from overtime because they are salaried. Duties and salary level decide.",
    "Calling a full-time drafter who works only for the firm an independent contractor.",
    "Assuming QBS means the cheapest qualified firm wins. Fee is negotiated after ranking."
  ],
  scenario: { prompt: "A 30-person firm asks interns to log 'unbilled' evening hours on a competition without pay. What is the problem?",
    answer: "Interns are typically non-exempt under the FLSA and must be paid overtime for hours over 40 in a week, including competition work. The firm also risks state wage claims. Pay the hours or limit the work to the normal workweek." },
  refs: [
    { t: "AIA, The Architect's Handbook of Professional Practice, 15th ed. — firm management, human resources, marketing and business development topics", a: "Purchase" },
    { t: "US Department of Labor, FLSA overtime and exemption guidance", a: "Free (dol.gov)" },
    { t: "Brooks Act (40 U.S.C. §§1101–1104)", a: "Free (uscode.house.gov)" }
  ],
  check: ["q-pcm-14", "q-pcm-15", "q-pcm-16"]
});

ARE.LESSONS.push({
  id: "pjm-quality", div: "pjm", obj: ["pjm-1.1", "pjm-2.3", "pjm-5.2", "pjm-5.3", "pjm-5.4"], title: "Teams, Communication & Quality Management",
  minutes: 35, level: "Practice",
  summary: "Assemble the right team, keep a clear project record, and build QA/QC into the work instead of checking at the end.",
  objectives: [
    "Select team members and consultants against project needs.",
    "Choose the right communication instrument and keep a project record.",
    "Distinguish quality assurance from quality control and plan both.",
    "Use constructability and coordination reviews to reduce risk."
  ],
  why: "Most claims against architects trace back to coordination errors and poor records, not bad design ideas. Process prevents them.",
  exam: "PjM's Quality Control section is analysis/evaluation level. Expect scenarios asking which review would have caught an error, or what the architect should document.",
  body: `
<h3>Assembling the team</h3>
<p>Match the team to the project's type, size, schedule and client. Typical roles: a <strong>principal-in-charge</strong> (client relationship, contract), a <strong>project manager</strong> (scope, schedule, fee, team), a <strong>project architect</strong> (technical quality and coordination) and production staff. Select consultants for relevant experience, capacity, insurance and working relationship; QBS logic applies to consultants too.</p>

<h3>Communication and the project record</h3>
<ul>
<li><strong>Meeting minutes</strong>: issue promptly, record decisions and action items with owners and dates, and ask recipients to report corrections by a deadline.</li>
<li><strong>Transmittals</strong>: record what was sent, to whom and when.</li>
<li><strong>Decision log</strong>: owner approvals at each phase, signed where possible.</li>
<li><strong>Emails and calls</strong>: confirm verbal directions in writing.</li>
</ul>
<p>Communication on a design-bid-build project runs through defined paths: the owner and contractor communicate through the architect on matters about the contract documents; consultants communicate through the architect.</p>

<h3>QA versus QC</h3>
<p><strong>Quality assurance</strong> is the system that prevents errors: standards, checklists, templates, staffing, training and a quality plan for the project. <strong>Quality control</strong> checks the work: milestone reviews, cross-discipline coordination checks, code reviews and peer review by someone outside the team. Schedule QC reviews in the work plan (for example at 50% and 90% CDs) with time to fix what they find.</p>

<h3>Constructability and coordination</h3>
<p>A <strong>constructability review</strong> asks whether the building can be built as drawn, in a sensible sequence, with available materials and trades. <strong>Coordination reviews</strong> overlay disciplines: structure against ceilings and ducts, plumbing against beams, door swings against equipment. BIM <strong>clash detection</strong> helps but does not replace a person reading the set.</p>`,
  diagram: "",
  formulas: [],
  example: { title: "Applying it", html: `<p>At the 90% CD review of a municipal fire hall, the project architect overlays the structural framing plan on the reflected ceiling plan and finds a W-beam crossing the apparatus bay exhaust duct at the same elevation. Catching it now costs a day of redesign; catching it in the field would cost a change order and a delay.</p>` },
  mistakes: [
    "Doing all checking at the end. Reviews must be scheduled and resourced.",
    "Letting the owner talk directly to the contractor about design changes during construction without the architect.",
    "Relying on software clash detection without a human review."
  ],
  scenario: { prompt: "An owner's facilities manager verbally approves a revised toilet room layout during a site meeting. What should you do?",
    answer: "Record the decision in the meeting minutes and confirm it in writing to the owner's designated representative, since the facilities manager may not have authority. If it changes the contract, process it as a change through the proper instrument." },
  refs: [
    { t: "AIA, The Architect's Handbook of Professional Practice, 15th ed. — project management, quality management and risk management topics", a: "Purchase" },
    { t: "AIA E203–2013 and G202–2013 (BIM and digital data protocols)", a: "Purchase" }
  ],
  check: ["q-pjm-14", "q-pjm-15", "q-pjm-16"]
});

Q({ id: "q-pcm-14", div: "pcm", obj: "pcm-1.2", lesson: "pcm-firm", type: "mc", diff: 2, fmt: "Multiple choice",
  q: "A firm with 22 employees must comply with which of these federal laws?",
  opts: ["Family and Medical Leave Act only", "Title VII and ADA Title I, but not FMLA", "None until it reaches 50 employees", "Only OSHA"],
  ans: 1,
  why: ["FMLA applies at 50 or more employees.", "Correct. Title VII and ADA Title I apply at 15 or more; ADEA at 20 or more; FMLA at 50.", "Several laws apply well below 50.", "OSHA applies, but so do the anti-discrimination laws."],
  explain: "Know the thresholds: 15 (Title VII, ADA I), 20 (ADEA), 50 (FMLA).",
  ref: "US EEOC and DOL guidance; Architect's Handbook, 15th ed. — human resources" });

Q({ id: "q-pcm-15", div: "pcm", obj: "pcm-1.2", lesson: "pcm-firm", type: "mc", diff: 2, fmt: "Scenario",
  q: "A drafter works full time at the firm's office, on the firm's software, on hours the project manager sets, and has no other clients. The firm pays her as an independent contractor. What is the risk?",
  opts: ["None, if she signed an independent contractor agreement", "Misclassification: she functions as an employee, exposing the firm to back taxes, overtime and penalties", "Only that she cannot be named on proposals", "The firm must buy her professional liability insurance"],
  ans: 1,
  why: ["Labels do not control; the actual working relationship does.", "Correct. The firm controls how, when and where she works.", "Not the main issue.", "Not the main issue."],

ARE.LESSONS.push({
  id: "ppd-siting", div: "ppd", obj: ["ppd-1.1", "ppd-1.3", "ppd-2.1", "ppd-4.1", "ppd-4.4"], title: "Siting, Configuration & Context",
  minutes: 40, level: "Core",
  summary: "Place the building on the site, shape it, and respond to zoning, environmental rules and the neighborhood.",
  objectives: [
    "Locate a building and site improvements from a site analysis (slope, flood zone, access, sun, soils).",
    "Apply zoning and environmental regulations: setbacks, stormwater, floodplain, wetlands buffers.",
    "Choose a building configuration that fits program, daylight and circulation.",
    "Respond to neighborhood context: street wall, scale, materials and historic character."
  ],
  why: "Siting decisions are made once and paid for forever: in earthwork, foundations, energy use, accessibility and how the neighborhood receives the building.",
  exam: "Hotspot items show a site plan and ask where the building, parking or entry should go. Multiple choice items ask which configuration best meets daylight, circulation and context goals.",
  body: `
<h3>Reading the site for placement</h3>
<p>Start with what you <em>cannot</em> build on, then where you <em>should</em> build. Rule out setbacks, easements, floodplain, wetlands and their buffers, steep slopes and poor soils. Within what is left, prefer:</p>
<ul>
<li><strong>Gentle slopes</strong> (under about 5%) for the footprint and parking, which limits cut, fill and retaining walls.</li>
<li><strong>High ground</strong> above the base flood elevation; drainage flows away from the building.</li>
<li><strong>Solar access</strong>: long facades facing north and south; outdoor spaces on the sunny side.</li>
<li><strong>Short, safe access</strong>: vehicle entry away from intersections; pedestrian entry directly from the public sidewalk.</li>
<li><strong>Preserved assets</strong>: mature trees, views, existing utilities.</li>
</ul>
<div class="callout"><b>Access rules to remember.</b> An accessible route must connect accessible parking, passenger loading zones, public transit stops and public sidewalks to the accessible entrance. Fire apparatus access roads typically must reach within 150 ft of all portions of the exterior walls (International Fire Code §503.1.1, unless modified by sprinklers or the fire official).</div>

<h3>Environmental regulations</h3>
<ul>
<li><strong>Stormwater</strong>: most jurisdictions limit post-development runoff to pre-development rates. <em>Detention</em> stores water temporarily and releases it slowly; <em>retention</em> holds it permanently or lets it infiltrate.</li>
<li><strong>Floodplain</strong>: build the lowest floor at or above the design flood elevation set by the jurisdiction (often base flood elevation plus freeboard).</li>
<li><strong>Wetlands and waterways</strong>: protected buffers; disturbance usually needs a permit.</li>
<li><strong>Impervious cover limits</strong> in some zoning codes push toward permeable paving and green roofs.</li>
</ul>

<h3>Configuration</h3>
<p>Building shape follows program, daylight and circulation. A <strong>double-loaded corridor</strong> (rooms both sides) is efficient. A <strong>single-loaded</strong> corridor gives every room daylight and views but more circulation area. Daylight reaches roughly <strong>1.5 to 2.5 times the window head height</strong> into a room, so deep floor plates need courtyards, atria or clerestories. Compact forms (low surface-to-volume ratio) save energy in cold climates. Elongated forms help daylight and cross-ventilation.</p>

<h3>Neighborhood context</h3>
<p>Match the <strong>street wall</strong> (consistent front setback) and cornice lines. Step building height down toward smaller neighbors. Place parking behind or beside the building rather than between the building and the street. Draw on local materials and rhythm. In historic districts, a review board may control massing, materials and windows.</p>`,
  diagram: `<svg viewBox="0 0 640 300" role="img" aria-label="Site plan with floodplain, steep slope, setbacks and the best building location. Tap parts to learn more.">
<g class="dg-text" font-size="11">
<rect x="20" y="20" width="600" height="250" class="dg-soft"/>
<g class="tip" data-tip="Floodplain|Land below the base flood elevation. Keep the building and its lowest floor out of it; parking or open space may be allowed."><path d="M20 200 Q160 180 240 270 L20 270 Z" class="dg-air"/><text x="60" y="250">Floodplain</text></g>
<g class="tip" data-tip="Steep slope (over 15%)|Close contour lines. Building here means retaining walls, stepped foundations and higher cost."><path d="M470 20 L620 20 L620 150 Q540 120 470 20 Z" class="dg-hatch"/><text x="540" y="60">Steep slope</text></g>
<line x1="20" y1="245" x2="620" y2="245" class="dg-line" stroke-dasharray="5 4"/>
<g class="tip" data-tip="Best building zone|Gentle slope, above the flood zone, inside the setbacks, long faces north and south, entry close to the street."><rect x="260" y="90" width="190" height="80" class="dg-accent"/><text x="355" y="135" text-anchor="middle" class="dg-ontint">Building</text></g>
<g class="tip" data-tip="Parking|Beside or behind the building, not between the building and the street. Keeps the street wall and a direct pedestrian entry."><rect x="470" y="170" width="140" height="70" class="dg-accent2"/><text x="540" y="210" text-anchor="middle">Parking</text></g>
<g class="tip" data-tip="Pedestrian entry|Accessible route straight from the public sidewalk and from accessible parking."><circle cx="355" cy="180" r="9" class="hs-dot"/><text x="372" y="196">Entry</text></g>
<text x="320" y="290" text-anchor="middle">Street (south) · public sidewalk</text>
<text x="30" y="36" font-size="10">N ↑</text>
</g></svg>`,
  formulas: [
    { name: "Daylight depth (rule of thumb)", f: "Useful daylight depth ≈ 1.5–2.5 × window head height" },
    { name: "Slope", f: "Slope % = Rise ÷ Run × 100" }
  ],
  example: { title: "Worked example: choosing between two sites on one lot", html: `<p>A 2-acre lot has a flat area near the street and a wooded rise at the back with 12% slopes. A creek corner sits in the 100-year floodplain. Place a one-story clinic on the flat area near the street, set back to match neighbors, with parking to the side. Use the floodplain corner for a bioretention basin and keep the wooded rise as open space. Result: minimal grading, a short accessible route, a street-facing entry and stormwater handled on site.</p>` },
  mistakes: [
    "Putting the parking lot between the building and the street in a walkable neighborhood.",
    "Siting on the flattest ground without checking the flood zone.",
    "Choosing a deep floor plate for an office that depends on daylight."
  ],
  scenario: { prompt: "A town wants a library on a corner lot that slopes 8% from the north down to the south street. Where do you put the building, parking and entry?",
    answer: "Set the building near the south street to hold the corner and give a level, accessible entry from the sidewalk. Step the floor or use a lower level to absorb the grade. Put parking to the side or rear, entered from the side street away from the intersection, and connect it with an accessible route. Long glazing faces north and south, with shading on the south." },
  quick: [
    { q: "Which stormwater approach stores runoff temporarily and releases it at a controlled rate?", opts: ["Retention", "Detention", "Infiltration trench", "Green roof"], a: 1, why: "Detention releases slowly. Retention keeps water permanently or lets it soak in." },
    { q: "Where should surface parking go to support a strong street wall?", opts: ["Between building and street", "Beside or behind the building", "Across the whole frontage", "On the roof only"], a: 1, why: "Keeping parking off the frontage lets the building define the street." }
  ],
  tryit: ["slope", "far"],
  refs: [
    { t: "2021 International Fire Code §503 (fire apparatus access roads)", a: "Free read-only (codes.iccsafe.org)" },
    { t: "2021 IBC §1104 (accessible route from site arrival points)", a: "Free read-only (codes.iccsafe.org)" },
    { t: "Brown & DeKay, Sun, Wind & Light, 3rd ed.", a: "Purchase" },
    { t: "AIA, Architect's Handbook, 15th ed., §9.6 case studies on neighborhood context (pp. 567–572)", a: "Your copy (Drive)" }

  check: ["q-ppd-14", "q-ppd-16", "q-ppd-20"]

ARE.LESSONS.push({
  id: "ppd-systems", div: "ppd", obj: ["ppd-3.1", "ppd-3.2", "ppd-3.3", "ppd-4.2"], title: "Choosing Structural, MEP & Special Systems",
  minutes: 45, level: "Core",
  summary: "Match structural, HVAC, plumbing, electrical, fire suppression, vertical transportation and acoustic systems to the building's use, spans, budget and height.",
  objectives: [
    "Select a structural system from spans, loads, height and construction type.",
    "Size structural members by rule of thumb for schematic design.",
    "Select an HVAC system type and reserve space for it.",
    "Select fire suppression, elevator and acoustic strategies for the use."
  ],
  why: "Systems drive floor-to-floor height, shaft locations, roof equipment, structure and cost. Choosing them early lets the design make room for them instead of fighting them.",
  exam: "PPD asks which system best fits a scenario (budget, span, flexibility, noise) and how systems affect configuration. Expect comparisons rather than engineering calculations.",
  body: `
<h3>Structure: match the system to the span</h3>
<table class="tbl"><thead><tr><th>System</th><th>Typical economical span</th><th>Notes</th></tr></thead><tbody>
<tr><td>Wood joists / light frame</td><td>12–20 ft</td><td>Low cost, combustible (Type V or III)</td></tr>
<tr><td>Open-web steel joists</td><td>20–60 ft</td><td>Light, fast; ducts pass through webs</td></tr>
<tr><td>Steel beams and girders</td><td>20–40 ft bays</td><td>Flexible, needs fireproofing in rated types</td></tr>
<tr><td>Concrete flat plate</td><td>15–30 ft</td><td>Thin, flat soffit; good for housing</td></tr>
<tr><td>Post-tensioned concrete</td><td>25–40 ft</td><td>Thinner slabs, longer spans; coring is restricted</td></tr>
<tr><td>Long-span trusses / space frames</td><td>60 ft and over</td><td>Gyms, arenas, hangars</td></tr>
</tbody></table>
<p>These ranges are typical, not limits; the structural engineer confirms them. Schematic rules of thumb: <strong>steel beam depth (in) ≈ span (ft) ÷ 2</strong>; <strong>open-web joist depth (in) ≈ span (ft) ÷ 2</strong> (roughly span/24); <strong>concrete flat plate thickness ≈ span ÷ 30</strong>. Lateral loads (wind, seismic) are resisted by shear walls, braced frames or moment frames, tied together by floor and roof diaphragms.</p>

<h3>HVAC: match the system to the use</h3>
<table class="tbl"><thead><tr><th>System</th><th>Fits</th><th>Space needs</th></tr></thead><tbody>
<tr><td>Packaged rooftop units</td><td>Low-rise retail, small offices</td><td>Roof structure and curbs; ducts in ceiling</td></tr>
<tr><td>Variable air volume (VAV), central air handler</td><td>Mid- and high-rise offices</td><td>Mechanical rooms, large shafts, deep plenums</td></tr>
<tr><td>Variable refrigerant flow (VRF) + dedicated outdoor air</td><td>Many zones, renovations, schools</td><td>Small refrigerant piping; outdoor units</td></tr>
<tr><td>Fan coil units + central plant</td><td>Hotels, residences</td><td>Piping shafts; unit in each room</td></tr>
<tr><td>Radiant floors / chilled beams + DOAS</td><td>High-performance buildings</td><td>Shallow ceilings; careful humidity control</td></tr>
</tbody></table>
<p>All-air systems need the most space: shafts, plenum depth and mechanical rooms. Water- and refrigerant-based systems move energy in small pipes and save ceiling depth.</p>

<h3>Special systems</h3>
<ul>
<li><strong>Fire suppression</strong> (NFPA 13): <em>wet pipe</em> in heated spaces; <em>dry pipe</em> where pipes could freeze; <em>preaction</em> where accidental discharge is costly (data rooms, archives); <em>deluge</em> for high-hazard spaces.</li>
<li><strong>Elevators</strong>: hydraulic for low-rise (typically up to about five or six stops), traction (including machine-room-less) for taller buildings and faster service.</li>
<li><strong>Acoustics</strong>: <em>STC</em> rates how well a partition blocks sound between rooms; <em>NRC</em> rates how much a surface absorbs. Use high-STC walls between noisy and quiet rooms and absorptive finishes to reduce reverberation.</li>
<li><strong>Lighting, security, communications</strong>: coordinate ceiling space, power and pathways early.</li>
</ul>`,
  diagram: `<svg viewBox="0 0 640 260" role="img" aria-label="Section through a floor showing structure depth, duct, sprinkler and light fixture in the plenum. Tap parts to learn more.">
<g class="dg-text" font-size="11">
